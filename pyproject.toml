[project]
name = "subsense"
version = "0.1.0"
description = "Subdomain enumeration + DNS vulnerability discovery tool for authorized security testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "subsense" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    "aiodns>=3.2",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "sqlmodel>=0.0.21",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.scripts]
subsense = "subsense.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subsense"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
